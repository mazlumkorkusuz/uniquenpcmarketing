name: Fetch co-op games

# Daily sync of Steam co-op new releases into steam_coop_games (read by /api/steam-charts).
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-coop-games
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # Script dependencies (cheerio, dotenv, tsx, supabase-js) live in scripts/package.json
      - run: npm install
        working-directory: scripts

      - name: Fetch co-op games
        run: npx tsx scripts/fetch-coop-games.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
